<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synth-Zooo Quiet World</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #080914;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<script>
// ============================================================
// Synth-Zooo Quiet World
// 軽量背景 + アクティブ連鎖 + 育つ小さな世界
// - 重い背景アニメーション / 花火 / Webフォントを削除
// - キャラクタースプライトは残す（画像が無くてもゲームは動作）
// - pixelDensity(1)
// - 色に依存しない6種類の記号タイル
// - 落下中も STABLE タイルは操作可能（アクティブ連鎖）
// - 元版に近い消去・落下テンポ
// - タップ + スライド/スワイプ交換
// - 1bitキャラが歩く・止まる・反転・連鎖数に応じて反応
// - スコアを廃止し、内部の連鎖ポイントで背景が育つ
// - リサイズ対応
// ============================================================

const COLS = 8;
const ROWS = 7;
const TILE_TYPES = 6;
const UI_HEIGHT = 140;
const STATE = { STABLE: 0, MATCHING: 1, FALLING: 2 };
const MATCH_FRAME = 60;
const FALL_SPEED = 8;

let tileSize = 48;
let grid = [];
let tileImages = [];

let dragStart = null;
let selectedTile = null;
let startMouseX = 0;
let startMouseY = 0;

let comboCount = 0;
// スコアの代わりに、連鎖による「世界の成長度」を内部だけで保持する。
let worldPoints = 0;
let worldStage = 0;
const WORLD_THRESHOLDS = [0, 5, 15, 30, 55];
let headerBg = null;

let comboTextTimer = 0;
let finalComboCount = 0;
let finalComboTimer = 0;
let chainGraceTimer = -1;

let messageTimer = 0;
let messageText = "NO MORE MOVES";

// キャラクター（元版と同じ2フレームのスプライトシート）
const playerImage = new Image();
let isPlayerReady = false;
playerImage.onload = () => { isPlayerReady = true; };
playerImage.onerror = () => { isPlayerReady = false; };
playerImage.src = 'player_1bit00_sheet.png';

// キャラクターの軽量な散歩ステート
let playerX = 40;
let playerDir = 1;
let playerSpeed = 0.28;
let playerPauseTimer = 0;
let playerWalkTimer = 0;
let playerJumpTimer = 0;
let playerJumpStrength = 0;
let playerReactionTimer = 0;
let playerReactionType = 'none';
let playerBaseSpeed = 0.28;

const TILE_COLORS = [
  [330, 75, 100], // pink
  [185, 75, 100], // cyan
  [55,  80, 100], // yellow
  [125, 70, 95],  // green
  [25,  85, 100], // orange
  [265, 60, 100]  // violet
];

function setup() {
  pixelDensity(1);
  calculateLayout();
  createCanvas(tileSize * COLS, UI_HEIGHT + tileSize * ROWS);
  colorMode(HSB, 360, 100, 100, 1);
  noSmooth();
  textFont('monospace');
  buildTileImages();
  rebuildHeaderBackground();
  playerDir = 1;
  playerPauseTimer = 0;
  playerX = Math.min(24, width * 0.08);
  initGrid();
}

function calculateLayout() {
  const maxTileW = windowWidth / COLS;
  const maxTileH = Math.max(20, (windowHeight - UI_HEIGHT) / ROWS);
  tileSize = Math.floor(Math.min(maxTileW, maxTileH));
}

function windowResized() {
  calculateLayout();
  resizeCanvas(tileSize * COLS, UI_HEIGHT + tileSize * ROWS);
  rebuildHeaderBackground();
  playerX = constrain(playerX, 24, width - 24);
}

function draw() {
  // 静的背景。毎フレームのグラデーションや星・山などは描かない。
  background(236, 45, 7);

  updateLogic();
  updatePlayer();
  drawHeader();
  drawUI();

  push();
  translate(0, UI_HEIGHT);
  drawBoardBackground();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t) t.draw();
    }
  }

  if (messageTimer > 0) {
    fill(0, 0, 0, 0.78);
    noStroke();
    rect(0, (ROWS * tileSize) / 2 - 28, width, 56);
    fill(0, 80, 100);
    textAlign(CENTER, CENTER);
    textSize(Math.max(16, width * 0.055));
    text(messageText, width / 2, (ROWS * tileSize) / 2);

    messageTimer--;
    if (messageTimer === 0) shuffleBoard();
  }

  pop();
}

function getWorldStage(points) {
  let stage = 0;
  for (let i = 0; i < WORLD_THRESHOLDS.length; i++) {
    if (points >= WORLD_THRESHOLDS[i]) stage = i;
  }
  return stage;
}

function rebuildHeaderBackground() {
  if (width <= 0) return;

  headerBg = createGraphics(width, UI_HEIGHT);
  headerBg.pixelDensity(1);
  headerBg.colorMode(HSB, 360, 100, 100, 1);
  headerBg.noSmooth();

  const g = headerBg;
  const stage = worldStage;

  // 毎フレーム計算せず、世界段階が変わったときだけ描き直す静的背景。
  const skyBrightness = [8, 9, 10, 12, 15][stage];
  g.background(225, 42, skyBrightness);

  // 地面
  g.noStroke();
  g.fill(215, 35, 7);
  g.rect(0, UI_HEIGHT - 24, width, 24);
  g.stroke(185, 25, 30, 0.55);
  g.strokeWeight(1);
  g.line(0, UI_HEIGHT - 24, width, UI_HEIGHT - 24);

  // Stage 1: 月
  if (stage >= 1) {
    g.noStroke();
    g.fill(50, 18, 92, 0.9);
    g.circle(width * 0.82, 30, 22);
    g.fill(225, 42, skyBrightness);
    g.circle(width * 0.86, 26, 19);
  }

  // Stage 2: 星。数を固定して軽くする。
  if (stage >= 2) {
    g.noStroke();
    for (let i = 0; i < 12; i++) {
      const x = ((i * 73 + 29) % Math.max(40, width - 30)) + 8;
      const y = 10 + ((i * 31) % 58);
      g.fill(55, 15, 92, 0.55 + (i % 3) * 0.15);
      g.rect(x, y, (i % 4 === 0) ? 2 : 1, (i % 4 === 0) ? 2 : 1);
    }
  }

  // Stage 3: 草と小さな花。単純な線だけ。
  if (stage >= 3) {
    g.stroke(120, 45, 28, 0.85);
    g.strokeWeight(1);
    for (let x = 8; x < width; x += 18) {
      const h = 4 + ((x * 7) % 8);
      g.line(x, UI_HEIGHT - 24, x - 2, UI_HEIGHT - 24 - h);
      g.line(x + 2, UI_HEIGHT - 24, x + 5, UI_HEIGHT - 24 - h * 0.7);
    }
    g.noStroke();
    for (let x = 22; x < width; x += 70) {
      g.fill((x * 3) % 360, 45, 70, 0.8);
      g.rect(x, UI_HEIGHT - 34, 2, 2);
    }
  }

  // Stage 4: 遠くの小さな灯り。世界が少し温かくなる。
  if (stage >= 4) {
    g.noStroke();
    for (let x = 18; x < width; x += 52) {
      g.fill(40, 70, 95, 0.75);
      g.rect(x, UI_HEIGHT - 19, 3, 3);
      g.fill(40, 45, 65, 0.18);
      g.rect(x - 2, UI_HEIGHT - 21, 7, 7);
    }
  }
}

function addWorldProgress(combo) {
  // 連鎖が深いほど少し強く世界が育つ。表示上のスコアにはしない。
  worldPoints += Math.max(1, combo);
  const nextStage = getWorldStage(worldPoints);
  if (nextStage !== worldStage) {
    worldStage = nextStage;
    rebuildHeaderBackground();
    // 世界が変化した瞬間だけ、キャラも少し大きく喜ぶ。
    playerReactionType = 'celebrate';
    playerReactionTimer = 80;
    playerJumpTimer = 28;
    playerJumpStrength = 10;
  }
}

function updatePlayer() {
  const pSize = Math.min(48, UI_HEIGHT * 0.42);
  const leftEdge = pSize * 0.55;
  const rightEdge = width - pSize * 0.55;

  if (playerJumpTimer > 0) playerJumpTimer--;
  if (playerReactionTimer > 0) playerReactionTimer--;
  else playerReactionType = 'none';

  if (playerPauseTimer > 0) {
    playerPauseTimer--;
    return;
  }

  let speed = playerBaseSpeed;
  if (playerReactionType === 'excited') speed *= 1.8;
  if (playerReactionType === 'celebrate') speed *= 1.35;

  playerX += playerDir * speed;
  playerWalkTimer++;

  if (playerX <= leftEdge) {
    playerX = leftEdge;
    playerDir = 1;
    playerPauseTimer = floor(random(45, 150));
  } else if (playerX >= rightEdge) {
    playerX = rightEdge;
    playerDir = -1;
    playerPauseTimer = floor(random(45, 150));
  } else if (playerWalkTimer > 180 && random() < 0.0025 && playerReactionType === 'none') {
    playerWalkTimer = 0;
    playerPauseTimer = floor(random(50, 170));
  }
}

function reactPlayerToCombo(combo) {
  // 2コマだけでも、ジャンプ量・歩行速度・反応時間で差をつける。
  if (combo <= 1) {
    playerReactionType = 'notice';
    playerReactionTimer = 24;
    playerJumpTimer = 12;
    playerJumpStrength = 3;
  } else if (combo <= 3) {
    playerReactionType = 'happy';
    playerReactionTimer = 40;
    playerJumpTimer = 18;
    playerJumpStrength = 6;
  } else if (combo <= 5) {
    playerReactionType = 'excited';
    playerReactionTimer = 70;
    playerJumpTimer = 24;
    playerJumpStrength = 9;
  } else {
    playerReactionType = 'celebrate';
    playerReactionTimer = 100;
    playerJumpTimer = 30;
    playerJumpStrength = 12;
  }
}

function drawHeader() {
  if (headerBg) image(headerBg, 0, 0);

  // 連鎖中だけ軽い明滅。大きな半透明レイヤーは使わない。
  if (comboCount > 1) {
    noStroke();
    fill(55, 20, 100, Math.min(0.07, comboCount * 0.01));
    rect(0, 0, width, UI_HEIGHT - 24);
  }

  if (isPlayerReady) {
    const walking = playerPauseTimer === 0;
    // ジャンプ中は2コマ目（足が開いている絵）固定。
    const sx = playerJumpTimer > 0
      ? 16
      : (walking ? ((Math.floor(frameCount / 15) % 2) ? 16 : 0) : 0);
    const pSize = Math.min(48, UI_HEIGHT * 0.42);

    let jumpY = 0;
    if (playerJumpTimer > 0) {
      const total = 32;
      const phase = 1 - playerJumpTimer / total;
      jumpY = -Math.sin(Math.PI * constrain(phase, 0, 1)) * playerJumpStrength;
    }

    // 大連鎖時はごく小さく上下に弾む。
    if (playerReactionType === 'celebrate' && playerJumpTimer === 0) {
      jumpY = -Math.abs(Math.sin(frameCount * 0.16)) * 2;
    }

    drawingContext.save();
    drawingContext.imageSmoothingEnabled = false;
    drawingContext.translate(playerX, UI_HEIGHT - 25 - pSize / 2 + jumpY);
    if (playerDir < 0) drawingContext.scale(-1, 1);
    drawingContext.drawImage(
      playerImage, sx, 0, 16, 16,
      -pSize / 2, -pSize / 2,
      pSize, pSize
    );
    drawingContext.restore();
  }
}

function drawUI() {
  // スコアは表示しない。プレイヤーに見せるのは現在の連鎖だけ。
  if (finalComboTimer > 0 && finalComboCount > 1) {
    textAlign(RIGHT, TOP);
    noStroke();
    fill(55, 65, 100);
    textSize(18);
    text(finalComboCount + ' COMBO!', width - 10, 8);
    finalComboTimer--;
  } else if (comboTextTimer > 0 && comboCount > 1) {
    textAlign(RIGHT, TOP);
    noStroke();
    fill(0, 0, 100, 0.72);
    textSize(15);
    text(comboCount + ' COMBO', width - 10, 9);
    comboTextTimer--;
  }
}

function drawBoardBackground() {
  noStroke();
  fill(225 + worldStage * 2, 30, 10 + worldStage * 0.8);
  rect(0, 0, width, ROWS * tileSize);

  stroke(0, 0, 100, 0.055);
  strokeWeight(1);
  for (let r = 0; r <= ROWS; r++) {
    line(0, r * tileSize, width, r * tileSize);
  }
  for (let c = 0; c <= COLS; c++) {
    line(c * tileSize, 0, c * tileSize, ROWS * tileSize);
  }
}

function buildTileImages() {
  tileImages = [];

  for (let type = 0; type < TILE_TYPES; type++) {
    const g = createGraphics(96, 96);
    g.pixelDensity(1);
    g.colorMode(HSB, 360, 100, 100, 1);
    g.clear();
    g.noSmooth();

    // 全タイルの地はほぼ同じ暗色にし、種類は記号だけでも判別できるようにする。
    // 色覚に依存せず、モノクロ表示でも区別可能。
    g.fill(235, 18, 20, 1);
    g.stroke(0, 0, 4, 1);
    g.strokeWeight(5);
    g.rect(10, 10, 76, 76, 4);

    // 記号そのものにタイプ色を付ける。
    // 暗い下線を一度描いてから色線を重ねることで、背景色に関係なく見やすくする。
    const col = TILE_COLORS[type];
    g.noFill();
    const cx = 48, cy = 48;

    const drawSymbol = () => {
      switch (type) {
      case 0: // circle
        g.ellipse(cx, cy, 34, 34);
        break;
      case 1: // triangle
        g.triangle(cx, 29, 29, 66, 67, 66);
        break;
      case 2: // diamond
        g.quad(cx, 27, 69, cy, cx, 69, 27, cy);
        break;
      case 3: // plus
        g.line(cx, 27, cx, 69);
        g.line(27, cy, 69, cy);
        break;
      case 4: // X
        g.line(30, 30, 66, 66);
        g.line(66, 30, 30, 66);
        break;
        case 5: // double bar
          g.line(31, 38, 65, 38);
          g.line(31, 58, 65, 58);
          break;
      }
    };

    // 輪郭（視認性確保）
    g.stroke(0, 0, 3, 1);
    g.strokeWeight(12);
    drawSymbol();

    // 色付き記号
    g.stroke(col[0], col[1], col[2], 1);
    g.strokeWeight(7);
    drawSymbol();

    tileImages[type] = g;
  }
}

function updateLogic() {
  let isBusy = false;

  for (let r = ROWS - 1; r >= 0; r--) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (!t) continue;
      if (t.state !== STATE.STABLE) isBusy = true;
      if (t.update()) {
        grid[r][c] = null;
      }
    }
  }

  // 空きマスへ落下・新規生成
  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] !== null) continue;

      isBusy = true;
      let found = false;

      for (let k = r - 1; k >= 0; k--) {
        if (grid[k][c] && grid[k][c].state !== STATE.FALLING) {
          grid[r][c] = grid[k][c];
          grid[r][c].r = r;
          grid[r][c].state = STATE.FALLING;
          grid[r][c].yOffset = (k - r) * tileSize;
          grid[k][c] = null;
          found = true;
          break;
        }
      }

      if (!found) {
        const nt = new Tile(r, c, floor(random(TILE_TYPES)));
        nt.state = STATE.FALLING;
        nt.yOffset = -tileSize * (r + 1);
        grid[r][c] = nt;
      }
    }
  }

  findMatches();

  if (!isBusy && !checkMatchesOnBoard()) {
    if (comboCount > 0) {
      if (chainGraceTimer === -1) {
        chainGraceTimer = 10;
      } else if (chainGraceTimer > 0) {
        chainGraceTimer--;
      } else {
        finalComboCount = comboCount;
        finalComboTimer = 120;
        comboCount = 0;
        chainGraceTimer = -1;
      }
    } else if (messageTimer === 0 && finalComboTimer === 0 && !hasPossibleMoves()) {
      messageTimer = 120;
    }
  } else {
    chainGraceTimer = -1;
  }
}

function findMatches() {
  const matches = [];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const t1 = grid[r][c];
      const t2 = grid[r][c + 1];
      const t3 = grid[r][c + 2];
      if (t1 && t2 && t3 && [t1, t2, t3].every(t => t.state === STATE.STABLE)) {
        if (t1.type === t2.type && t1.type === t3.type) {
          matches.push({ tiles: [t1, t2, t3] });
        }
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const t1 = grid[r][c];
      const t2 = grid[r + 1][c];
      const t3 = grid[r + 2][c];
      if (t1 && t2 && t3 && [t1, t2, t3].every(t => t.state === STATE.STABLE)) {
        if (t1.type === t2.type && t1.type === t3.type) {
          matches.push({ tiles: [t1, t2, t3] });
        }
      }
    }
  }

  if (matches.length === 0) return;

  let firstMatchInThisStep = false;

  for (const m of matches) {
    let isNew = false;
    for (const t of m.tiles) {
      if (t.state !== STATE.MATCHING) {
        t.state = STATE.MATCHING;
        t.timer = MATCH_FRAME;
        isNew = true;
      }
    }
    if (isNew) firstMatchInThisStep = true;
  }

  if (firstMatchInThisStep) {
    comboCount++;
    comboTextTimer = 60;
    finalComboTimer = 0;
    addWorldProgress(comboCount);
    reactPlayerToCombo(comboCount);
  }
}

function hasPossibleMoves() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1 && testMove(r, c, r, c + 1)) return true;
      if (r < ROWS - 1 && testMove(r, c, r + 1, c)) return true;
    }
  }
  return false;
}

function testMove(r1, c1, r2, c2) {
  const t1 = grid[r1][c1];
  const t2 = grid[r2][c2];
  if (!t1 || !t2) return false;

  const a = t1.type;
  const b = t2.type;
  t1.type = b;
  t2.type = a;

  const result = hasMatch(r1, c1) || hasMatch(r2, c2);

  t1.type = a;
  t2.type = b;
  return result;
}

class Tile {
  constructor(r, c, type) {
    this.r = r;
    this.c = c;
    this.type = type;
    this.state = STATE.STABLE;
    this.timer = 0;
    this.yOffset = 0;
  }

  draw() {
    const x = this.c * tileSize;
    const y = this.r * tileSize + this.yOffset;

    push();
    translate(x + tileSize / 2, y + tileSize / 2);

    if (this.state === STATE.MATCHING) {
      const s = map(this.timer, MATCH_FRAME, 0, 1.0, 0.0);
      scale(s);
    }

    imageMode(CENTER);
    image(tileImages[this.type], 0, 0, tileSize * 0.84, tileSize * 0.84);

    if (selectedTile && selectedTile.r === this.r && selectedTile.c === this.c) {
      noFill();
      stroke(0, 0, 100, 0.8);
      strokeWeight(2);
      rectMode(CENTER);
      rect(0, 0, tileSize * 0.82, tileSize * 0.82, 5);
      rectMode(CORNER);
    }

    pop();
  }

  update() {
    if (this.state === STATE.MATCHING) {
      this.timer--;
      return this.timer <= 0;
    }

    if (this.state === STATE.FALLING) {
      this.yOffset += FALL_SPEED;
      if (this.yOffset >= 0) {
        this.yOffset = 0;
        this.state = STATE.STABLE;
      }
    }

    return false;
  }
}

function touchMoved() {
  return false;
}

function mousePressed() {
  if (messageTimer > 0) return;

  finalComboTimer = 0;

  const c = floor(mouseX / tileSize);
  const r = floor((mouseY - UI_HEIGHT) / tileSize);

  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
    if (grid[r][c]?.state === STATE.STABLE) {
      dragStart = { r, c };
      startMouseX = mouseX;
      startMouseY = mouseY;
    }
  }
}

function mouseReleased() {
  if (!dragStart || messageTimer > 0) {
    dragStart = null;
    return;
  }

  const dx = mouseX - startMouseX;
  const dy = mouseY - startMouseY;
  const swipeThreshold = Math.max(12, tileSize * 0.22);

  if (abs(dx) < swipeThreshold && abs(dy) < swipeThreshold) {
    const c = floor(mouseX / tileSize);
    const r = floor((mouseY - UI_HEIGHT) / tileSize);

    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c]?.state === STATE.STABLE) {
      if (selectedTile) {
        if (abs(selectedTile.r - r) + abs(selectedTile.c - c) === 1) {
          trySwap(selectedTile.r, selectedTile.c, r, c);
          selectedTile = null;
        } else {
          selectedTile = { r, c };
        }
      } else {
        selectedTile = { r, c };
      }
    }
  } else {
    let r2 = dragStart.r;
    let c2 = dragStart.c;

    if (abs(dx) > abs(dy)) {
      c2 += dx > 0 ? 1 : -1;
    } else {
      r2 += dy > 0 ? 1 : -1;
    }

    trySwap(dragStart.r, dragStart.c, r2, c2);
    selectedTile = null;
  }

  dragStart = null;
}

function trySwap(r1, c1, r2, c2) {
  if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;

  const t1 = grid[r1][c1];
  const t2 = grid[r2][c2];
  if (!t1 || !t2) return;
  if (t1.state !== STATE.STABLE || t2.state !== STATE.STABLE) return;

  const a = t1.type;
  const b = t2.type;
  t1.type = b;
  t2.type = a;

  if (!hasMatch(r1, c1) && !hasMatch(r2, c2)) {
    t1.type = a;
    t2.type = b;
  }
}

function hasMatch(r, c) {
  const type = grid[r][c]?.type;
  if (type === undefined) return false;

  let h = 1;
  let v = 1;

  for (let i = c - 1; i >= 0 && grid[r][i]?.type === type; i--) h++;
  for (let i = c + 1; i < COLS && grid[r][i]?.type === type; i++) h++;
  for (let i = r - 1; i >= 0 && grid[i][c]?.type === type; i--) v++;
  for (let i = r + 1; i < ROWS && grid[i][c]?.type === type; i++) v++;

  return h >= 3 || v >= 3;
}

function checkMatchesOnBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (hasMatch(r, c)) return true;
    }
  }
  return false;
}

function shuffleBoard() {
  const MAX_ATTEMPTS = 500;

  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    grid = [];

    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        grid[r][c] = new Tile(r, c, floor(random(TILE_TYPES)));
      }
    }

    if (!checkMatchesOnBoard() && hasPossibleMoves()) {
      selectedTile = null;
      dragStart = null;
      return;
    }
  }

  // 念のため。通常ここには来ない。
  console.warn('Board generation reached maximum attempts.');
}

function initGrid() {
  shuffleBoard();
  worldPoints = 0;
  worldStage = 0;
  rebuildHeaderBackground();
  comboCount = 0;
}
</script>
