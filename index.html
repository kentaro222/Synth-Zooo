<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synth-Zooo Ambient</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #070912;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
<script>
// ============================================================
// Synth-Zooo Ambient
// - 軽量なアクティブ連鎖パズル
// - 記号＋色タイル
// - 1bitキャラは連鎖と連動せず、静かに歩く
// - 背景は明確な景色を持たない抽象的アンビエント演出
// - 背景は時間とともにゆっくり循環し、連鎖時だけ柔らかく明るくなる
// ============================================================

const COLS = 8;
const ROWS = 7;
const TILE_TYPES = 6;
const UI_HEIGHT = 140;
const STATE = { STABLE: 0, MATCHING: 1, FALLING: 2 };
const MATCH_FRAME = 60;
const FALL_SPEED = 8;

let tileSize = 48;
let grid = [];
let tileImages = [];

let dragStart = null;
let selectedTile = null;
let startMouseX = 0;
let startMouseY = 0;

let comboCount = 0;
let comboTextTimer = 0;
let finalComboCount = 0;
let finalComboTimer = 0;
let chainGraceTimer = -1;

let messageTimer = 0;
let messageText = 'NO MORE MOVES';

// subtle ambient pulse driven by play, but not progression
let ambientPulse = 0;
let ambientPulseTarget = 0;

const playerImage = new Image();
let isPlayerReady = false;
playerImage.onload = () => { isPlayerReady = true; };
playerImage.onerror = () => { isPlayerReady = false; };
playerImage.src = 'player_1bit00_sheet.png';

let playerX = 40;
let playerDir = 1;
let playerBaseSpeed = 0.28;
let playerPauseTimer = 0;
let playerWalkTimer = 0;
let playerIdleLookTimer = 0;

let ambientLayers = [];
let ambientSpecks = [];

const TILE_COLORS = [
  [330, 75, 100],
  [185, 75, 100],
  [55,  80, 100],
  [125, 70, 95],
  [25,  85, 100],
  [265, 60, 100]
];

function setup() {
  pixelDensity(1);
  calculateLayout();
  createCanvas(tileSize * COLS, UI_HEIGHT + tileSize * ROWS);
  colorMode(HSB, 360, 100, 100, 1);
  noSmooth();
  textFont('monospace');

  buildTileImages();
  rebuildAmbientLayers();

  playerX = 24;
  playerDir = 1;
  initGrid();
}

function calculateLayout() {
  const maxTileW = windowWidth / COLS;
  const maxTileH = Math.max(20, (windowHeight - UI_HEIGHT) / ROWS);
  tileSize = Math.floor(Math.min(maxTileW, maxTileH));
}

function windowResized() {
  calculateLayout();
  resizeCanvas(tileSize * COLS, UI_HEIGHT + tileSize * ROWS);
  rebuildAmbientLayers();
  playerX = constrain(playerX, 24, width - 24);
}

function rebuildAmbientLayers() {
  ambientLayers = [];
  const layerPalettes = [
    { hue: 215, sat: 30, bri: 18, alpha: 0.18 },
    { hue: 248, sat: 24, bri: 24, alpha: 0.16 },
    { hue: 188, sat: 20, bri: 20, alpha: 0.12 }
  ];

  for (let i = 0; i < layerPalettes.length; i++) {
    const pal = layerPalettes[i];
    const g = createGraphics(width, UI_HEIGHT);
    g.pixelDensity(1);
    g.colorMode(HSB, 360, 100, 100, 1);
    g.clear();
    g.noStroke();

    // 抽象的な大きい光の塊。輪郭をはっきりさせないため楕円を重ねる。
    for (let j = 0; j < 6; j++) {
      const x = ((j * 79 + i * 47) % Math.max(50, width - 20)) + 10;
      const y = 10 + ((j * 29 + i * 13) % Math.max(20, UI_HEIGHT - 40));
      const w = 48 + ((j * 37 + i * 11) % 70);
      const h = 28 + ((j * 19 + i * 7) % 44);
      g.fill((pal.hue + j * 6) % 360, pal.sat, pal.bri, pal.alpha * (0.7 + (j % 3) * 0.25));
      g.ellipse(x, y, w, h);
    }

    ambientLayers.push(g);
  }

  ambientSpecks = [];
  for (let i = 0; i < 9; i++) {
    ambientSpecks.push({
      x: ((i * 61 + 17) % Math.max(30, width - 10)) + 5,
      y: 10 + ((i * 17 + 9) % Math.max(18, UI_HEIGHT - 30)),
      phase: i * 0.7,
      size: (i % 3) + 1
    });
  }
}

function draw() {
  background(232, 38, 7);

  updateLogic();
  updateAmbient();
  updatePlayer();

  drawHeader();
  drawUI();

  push();
  translate(0, UI_HEIGHT);
  drawBoardBackground();

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (t) t.draw();
    }
  }

  if (messageTimer > 0) {
    fill(0, 0, 0, 0.78);
    noStroke();
    rect(0, (ROWS * tileSize) / 2 - 28, width, 56);
    fill(0, 80, 100);
    textAlign(CENTER, CENTER);
    textSize(Math.max(16, width * 0.055));
    text(messageText, width / 2, (ROWS * tileSize) / 2);

    messageTimer--;
    if (messageTimer === 0) shuffleBoard();
  }

  pop();
}

function updateAmbient() {
  ambientPulseTarget *= 0.94;
  ambientPulse = lerp(ambientPulse, ambientPulseTarget, 0.08);
}

function updatePlayer() {
  const pSize = Math.min(48, UI_HEIGHT * 0.42);
  const leftEdge = pSize * 0.55;
  const rightEdge = width - pSize * 0.55;

  if (playerIdleLookTimer > 0) playerIdleLookTimer--;

  if (playerPauseTimer > 0) {
    playerPauseTimer--;
    if (playerPauseTimer === 0 && random() < 0.35) playerIdleLookTimer = floor(random(20, 50));
    return;
  }

  playerX += playerDir * playerBaseSpeed;
  playerWalkTimer++;

  if (playerX <= leftEdge) {
    playerX = leftEdge;
    playerDir = 1;
    playerPauseTimer = floor(random(50, 170));
  } else if (playerX >= rightEdge) {
    playerX = rightEdge;
    playerDir = -1;
    playerPauseTimer = floor(random(50, 170));
  } else if (playerWalkTimer > 180 && random() < 0.0025) {
    playerWalkTimer = 0;
    playerPauseTimer = floor(random(40, 130));
  }
}

function drawHeader() {
  const t = frameCount * 0.0032;
  const pulse = ambientPulse;

  // ゆっくり循環する抽象背景。
  const baseHue = 220 + sin(t * 0.9) * 10 + pulse * 6;
  const upperHue = 246 + sin(t * 0.6 + 1.2) * 12 + pulse * 8;
  const lowerHue = 196 + sin(t * 0.7 + 3.1) * 8 + pulse * 4;

  noStroke();
  for (let y = 0; y < UI_HEIGHT; y += 2) {
    const k = y / max(1, UI_HEIGHT - 1);
    const h = lerp(upperHue, lowerHue, k);
    const s = lerp(28, 18, k);
    const b = lerp(13 + pulse * 9, 9 + pulse * 5, k);
    fill((h + 360) % 360, s, b, 1);
    rect(0, y, width, 2);
  }

  // 静かな光のレイヤー。
  for (let i = 0; i < ambientLayers.length; i++) {
    const xoff = sin(t * (0.7 + i * 0.17) + i * 1.1) * (6 + i * 3);
    const yoff = cos(t * (0.5 + i * 0.11) + i * 0.8) * (3 + i * 1.5);
    const alpha = 140 + sin(t * (0.8 + i * 0.15) + i) * 30 + pulse * 70;
    tint(255, alpha);
    image(ambientLayers[i], xoff, yoff);
    noTint();
  }

  // ごく淡い光点。具体物にならない程度に少数。
  for (const s of ambientSpecks) {
    const tw = 0.35 + 0.25 * sin(t * 3.2 + s.phase) + pulse * 0.18;
    fill(55, 10, 85, max(0, tw));
    rect(s.x + sin(t + s.phase) * 1.5, s.y + cos(t * 0.8 + s.phase) * 1.5, s.size, s.size);
  }

  // キャラのための非常に細い足場線。
  stroke(200, 20, 28, 0.35 + pulse * 0.12);
  strokeWeight(1);
  line(0, UI_HEIGHT - 24, width, UI_HEIGHT - 24);

  if (isPlayerReady) {
    const walking = playerPauseTimer === 0;
    const sx = walking ? ((Math.floor(frameCount / 15) % 2) ? 16 : 0) : 0;
    const pSize = Math.min(48, UI_HEIGHT * 0.42);
    const bob = walking ? -Math.abs(Math.sin(frameCount * 0.12)) * 1.2 : 0;
    const lookLift = playerIdleLookTimer > 0 ? -1.5 : 0;

    drawingContext.save();
    drawingContext.imageSmoothingEnabled = false;
    drawingContext.translate(playerX, UI_HEIGHT - 25 - pSize / 2 + bob + lookLift);
    if (playerDir < 0) drawingContext.scale(-1, 1);
    drawingContext.drawImage(
      playerImage, sx, 0, 16, 16,
      -pSize / 2, -pSize / 2,
      pSize, pSize
    );
    drawingContext.restore();
  }
}

function drawUI() {
  if (finalComboTimer > 0 && finalComboCount > 1) {
    textAlign(RIGHT, TOP);
    noStroke();
    fill(55, 30, 100, 0.92);
    textSize(18);
    text(finalComboCount + ' COMBO!', width - 10, 8);
    finalComboTimer--;
  } else if (comboTextTimer > 0 && comboCount > 1) {
    textAlign(RIGHT, TOP);
    noStroke();
    fill(0, 0, 100, 0.68);
    textSize(15);
    text(comboCount + ' COMBO', width - 10, 9);
    comboTextTimer--;
  }
}

function drawBoardBackground() {
  noStroke();
  const pulse = ambientPulse;
  fill(226 + pulse * 4, 28, 10 + pulse * 3);
  rect(0, 0, width, ROWS * tileSize);

  stroke(0, 0, 100, 0.05);
  strokeWeight(1);
  for (let r = 0; r <= ROWS; r++) line(0, r * tileSize, width, r * tileSize);
  for (let c = 0; c <= COLS; c++) line(c * tileSize, 0, c * tileSize, ROWS * tileSize);
}

function buildTileImages() {
  tileImages = [];

  for (let type = 0; type < TILE_TYPES; type++) {
    const g = createGraphics(96, 96);
    g.pixelDensity(1);
    g.colorMode(HSB, 360, 100, 100, 1);
    g.clear();
    g.noSmooth();

    g.fill(235, 18, 20, 1);
    g.stroke(0, 0, 4, 1);
    g.strokeWeight(5);
    g.rect(10, 10, 76, 76, 4);

    const col = TILE_COLORS[type];
    g.noFill();
    const cx = 48, cy = 48;

    const drawSymbol = () => {
      switch (type) {
        case 0:
          g.ellipse(cx, cy, 34, 34);
          break;
        case 1:
          g.triangle(cx, 29, 29, 66, 67, 66);
          break;
        case 2:
          g.quad(cx, 27, 69, cy, cx, 69, 27, cy);
          break;
        case 3:
          g.line(cx, 27, cx, 69);
          g.line(27, cy, 69, cy);
          break;
        case 4:
          g.line(30, 30, 66, 66);
          g.line(66, 30, 30, 66);
          break;
        case 5:
          g.line(31, 38, 65, 38);
          g.line(31, 58, 65, 58);
          break;
      }
    };

    g.stroke(0, 0, 3, 1);
    g.strokeWeight(12);
    drawSymbol();

    g.stroke(col[0], col[1], col[2], 1);
    g.strokeWeight(7);
    drawSymbol();

    tileImages[type] = g;
  }
}

function updateLogic() {
  let isBusy = false;

  for (let r = ROWS - 1; r >= 0; r--) {
    for (let c = 0; c < COLS; c++) {
      const t = grid[r][c];
      if (!t) continue;
      if (t.state !== STATE.STABLE) isBusy = true;
      if (t.update()) grid[r][c] = null;
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c] !== null) continue;

      isBusy = true;
      let found = false;

      for (let k = r - 1; k >= 0; k--) {
        if (grid[k][c] && grid[k][c].state !== STATE.FALLING) {
          grid[r][c] = grid[k][c];
          grid[r][c].r = r;
          grid[r][c].state = STATE.FALLING;
          grid[r][c].yOffset = (k - r) * tileSize;
          grid[k][c] = null;
          found = true;
          break;
        }
      }

      if (!found) {
        const nt = new Tile(r, c, floor(random(TILE_TYPES)));
        nt.state = STATE.FALLING;
        nt.yOffset = -tileSize * (r + 1);
        grid[r][c] = nt;
      }
    }
  }

  findMatches();

  if (!isBusy && !checkMatchesOnBoard()) {
    if (comboCount > 0) {
      if (chainGraceTimer === -1) {
        chainGraceTimer = 10;
      } else if (chainGraceTimer > 0) {
        chainGraceTimer--;
      } else {
        finalComboCount = comboCount;
        finalComboTimer = 120;
        comboCount = 0;
        chainGraceTimer = -1;
      }
    } else if (messageTimer === 0 && finalComboTimer === 0 && !hasPossibleMoves()) {
      messageTimer = 120;
    }
  } else {
    chainGraceTimer = -1;
  }
}

function findMatches() {
  const matches = [];

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      const t1 = grid[r][c];
      const t2 = grid[r][c + 1];
      const t3 = grid[r][c + 2];
      if (t1 && t2 && t3 && [t1, t2, t3].every(t => t.state === STATE.STABLE)) {
        if (t1.type === t2.type && t1.type === t3.type) matches.push({ tiles: [t1, t2, t3] });
      }
    }
  }

  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      const t1 = grid[r][c];
      const t2 = grid[r + 1][c];
      const t3 = grid[r + 2][c];
      if (t1 && t2 && t3 && [t1, t2, t3].every(t => t.state === STATE.STABLE)) {
        if (t1.type === t2.type && t1.type === t3.type) matches.push({ tiles: [t1, t2, t3] });
      }
    }
  }

  if (matches.length === 0) return;

  let firstMatchInThisStep = false;
  for (const m of matches) {
    let isNew = false;
    for (const t of m.tiles) {
      if (t.state !== STATE.MATCHING) {
        t.state = STATE.MATCHING;
        t.timer = MATCH_FRAME;
        isNew = true;
      }
    }
    if (isNew) firstMatchInThisStep = true;
  }

  if (firstMatchInThisStep) {
    comboCount++;
    comboTextTimer = 60;
    finalComboTimer = 0;

    // 背景は連鎖数に応じて少しだけ明るくなるが、成長や完成はしない。
    ambientPulseTarget = max(ambientPulseTarget, min(0.8, 0.12 + comboCount * 0.08));
  }
}

function hasPossibleMoves() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1 && testMove(r, c, r, c + 1)) return true;
      if (r < ROWS - 1 && testMove(r, c, r + 1, c)) return true;
    }
  }
  return false;
}

function testMove(r1, c1, r2, c2) {
  const t1 = grid[r1][c1];
  const t2 = grid[r2][c2];
  if (!t1 || !t2) return false;

  const a = t1.type;
  const b = t2.type;
  t1.type = b;
  t2.type = a;

  const result = hasMatch(r1, c1) || hasMatch(r2, c2);

  t1.type = a;
  t2.type = b;
  return result;
}

class Tile {
  constructor(r, c, type) {
    this.r = r;
    this.c = c;
    this.type = type;
    this.state = STATE.STABLE;
    this.timer = 0;
    this.yOffset = 0;
  }

  draw() {
    const x = this.c * tileSize;
    const y = this.r * tileSize + this.yOffset;

    push();
    translate(x + tileSize / 2, y + tileSize / 2);

    if (this.state === STATE.MATCHING) {
      const s = map(this.timer, MATCH_FRAME, 0, 1.0, 0.0);
      scale(s);
    }

    imageMode(CENTER);
    image(tileImages[this.type], 0, 0, tileSize * 0.84, tileSize * 0.84);

    if (selectedTile && selectedTile.r === this.r && selectedTile.c === this.c) {
      noFill();
      stroke(0, 0, 100, 0.8);
      strokeWeight(2);
      rectMode(CENTER);
      rect(0, 0, tileSize * 0.82, tileSize * 0.82, 5);
      rectMode(CORNER);
    }

    pop();
  }

  update() {
    if (this.state === STATE.MATCHING) {
      this.timer--;
      return this.timer <= 0;
    }

    if (this.state === STATE.FALLING) {
      this.yOffset += FALL_SPEED;
      if (this.yOffset >= 0) {
        this.yOffset = 0;
        this.state = STATE.STABLE;
      }
    }

    return false;
  }
}

function touchMoved() {
  return false;
}

function mousePressed() {
  if (messageTimer > 0) return;

  finalComboTimer = 0;
  const c = floor(mouseX / tileSize);
  const r = floor((mouseY - UI_HEIGHT) / tileSize);

  if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
    if (grid[r][c]?.state === STATE.STABLE) {
      dragStart = { r, c };
      startMouseX = mouseX;
      startMouseY = mouseY;
    }
  }
}

function mouseReleased() {
  if (!dragStart || messageTimer > 0) {
    dragStart = null;
    return;
  }

  const dx = mouseX - startMouseX;
  const dy = mouseY - startMouseY;
  const swipeThreshold = Math.max(12, tileSize * 0.22);

  if (abs(dx) < swipeThreshold && abs(dy) < swipeThreshold) {
    const c = floor(mouseX / tileSize);
    const r = floor((mouseY - UI_HEIGHT) / tileSize);

    if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c]?.state === STATE.STABLE) {
      if (selectedTile) {
        if (abs(selectedTile.r - r) + abs(selectedTile.c - c) === 1) {
          trySwap(selectedTile.r, selectedTile.c, r, c);
          selectedTile = null;
        } else {
          selectedTile = { r, c };
        }
      } else {
        selectedTile = { r, c };
      }
    }
  } else {
    let r2 = dragStart.r;
    let c2 = dragStart.c;

    if (abs(dx) > abs(dy)) c2 += dx > 0 ? 1 : -1;
    else r2 += dy > 0 ? 1 : -1;

    trySwap(dragStart.r, dragStart.c, r2, c2);
    selectedTile = null;
  }

  dragStart = null;
}

function trySwap(r1, c1, r2, c2) {
  if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;

  const t1 = grid[r1][c1];
  const t2 = grid[r2][c2];
  if (!t1 || !t2) return;
  if (t1.state !== STATE.STABLE || t2.state !== STATE.STABLE) return;

  const a = t1.type;
  const b = t2.type;
  t1.type = b;
  t2.type = a;

  if (!hasMatch(r1, c1) && !hasMatch(r2, c2)) {
    t1.type = a;
    t2.type = b;
  }
}

function hasMatch(r, c) {
  const type = grid[r][c]?.type;
  if (type === undefined) return false;

  let h = 1;
  let v = 1;

  for (let i = c - 1; i >= 0 && grid[r][i]?.type === type; i--) h++;
  for (let i = c + 1; i < COLS && grid[r][i]?.type === type; i++) h++;
  for (let i = r - 1; i >= 0 && grid[i][c]?.type === type; i--) v++;
  for (let i = r + 1; i < ROWS && grid[i][c]?.type === type; i++) v++;

  return h >= 3 || v >= 3;
}

function checkMatchesOnBoard() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (hasMatch(r, c)) return true;
    }
  }
  return false;
}

function shuffleBoard() {
  const MAX_ATTEMPTS = 500;

  for (let attempt = 0; attempt < MAX_ATTEMPTS; attempt++) {
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      grid[r] = [];
      for (let c = 0; c < COLS; c++) {
        grid[r][c] = new Tile(r, c, floor(random(TILE_TYPES)));
      }
    }
    if (!checkMatchesOnBoard() && hasPossibleMoves()) {
      selectedTile = null;
      dragStart = null;
      return;
    }
  }

  console.warn('Board generation reached maximum attempts.');
}

function initGrid() {
  shuffleBoard();
  comboCount = 0;
  ambientPulse = 0;
  ambientPulseTarget = 0;
}
</script>
</body>
</html>
