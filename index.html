<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Synth-Zooo</title>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: #020010; 
            overflow: hidden; touch-action: none;
        }
        canvas { 
            border: 2px solid #ff00ff; 
            border-radius: 4px; 
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3), 0 0 40px rgba(0, 255, 255, 0.2);
            image-rendering: pixelated; 
        }
    </style>
</head>
<body>

<script>
// --- 定数 ---
const COLS = 8; 
const ROWS = 7; 
const UI_HEIGHT = 180; 
const TILE_TYPES = 6;
const STATE = { STABLE: 0, MATCHING: 1, FALLING: 2 };
const MATCH_FRAME = 60;

// --- グローバル変数 ---
let tileSize, grid = [];
let dragStart = null, selectedTile = null;
let startMouseX = 0, startMouseY = 0; 
let score = 0;

let comboCount = 0;
let lastMatchType = 0; 
let pendingFireworks = [];
let fireworks = [];
let tileImages = [];

let comboTextTimer = 0;
let finalComboCount = 0;
let finalComboTimer = 0;

let messageTimer = 0;
let messageText = "NO MORE MOVES!";

// ★追加：アクティブ連鎖の猶予フレーム用タイマー
let chainGraceTimer = -1; 

// --- Synthwave用変数 ---
let synthHue = 280;
let synthScrollX = 0;
let synthStars = [];

let playerImage = new Image();
playerImage.src = 'player_1bit00_sheet.png';
let isPlayerReady = false;
playerImage.onload = () => { isPlayerReady = true; };

const NEON_COLORS = [
    {h: 300, s: 100, b: 100}, // マゼンタ
    {h: 180, s: 100, b: 100}, // シアン
    {h: 60,  s: 100, b: 100}, // イエロー
    {h: 120, s: 100, b: 100}, // ライムグリーン
    {h: 15,  s: 100, b: 100}, // オレンジ
    {h: 0,   s: 0,   b: 100}  // ホワイト
];

function setup() {
    let cw = Math.min(windowWidth, windowHeight * 0.65);
    tileSize = cw / COLS;
    createCanvas(cw, UI_HEIGHT + tileSize * ROWS);
    colorMode(HSB, 360, 100, 100, 1);
    
    textFont('DotGothic16');
    noSmooth(); 

    for(let i = 0; i < 30; i++) {
        synthStars.push({
            x: Math.random() * width,
            y: Math.random() * (UI_HEIGHT * 0.65), 
            size: 2,
            speed: Math.random() * 0.2 + 0.1
        });
    }

    for (let i = 0; i < TILE_TYPES; i++) {
        let g = createGraphics(100, 100);
        g.colorMode(HSB, 360, 100, 100);
        let col = NEON_COLORS[i];
        
        g.fill(col.h, col.s, col.b);
        g.stroke(0); 
        g.strokeWeight(6);
        g.rect(10, 10, 80, 80); 
        
        g.noStroke();
        g.fill(0, 0, 100, 0.4); 
        g.rect(20, 20, 15, 15);
        
        tileImages[i] = g;
    }

    initGrid();
}

function draw() {
    background(0);

    updateLogic();

    let groundY = UI_HEIGHT * 0.65; 

    synthHue = (synthHue + 0.1) % 360;
    synthScrollX += 1.2;
    let skyGrad = drawingContext.createLinearGradient(0, 0, 0, groundY);
    skyGrad.addColorStop(0, `hsl(${(synthHue + 180) % 360}, 80%, 10%)`);
    skyGrad.addColorStop(1, `hsl(${(synthHue + 30) % 360}, 80%, 35%)`);
    drawingContext.fillStyle = skyGrad;
    drawingContext.fillRect(0, 0, width, groundY);

    fill(0, 0, 100); noStroke();
    for(let s of synthStars) {
        s.x -= s.speed;
        if(s.x < 0) { s.x = width; s.y = Math.random() * groundY; }
        rect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
    }

    fill((synthHue + 20) % 360, 50, 8); noStroke();
    for (let i = 0; i < 4; i++) {
        let loopWidth = width + 300;
        let mx = ((i * 300 - synthScrollX * 0.3) % loopWidth + loopWidth) % loopWidth - 150;
        triangle(mx, groundY, mx + 150, groundY - 60, mx + 300, groundY);
    }

    for (let i = fireworks.length - 1; i >= 0; i--) {
        fireworks[i].update();
        fireworks[i].draw();
        if (fireworks[i].isDead) fireworks.splice(i, 1);
    }

    fill(0);
    rect(0, groundY, width, UI_HEIGHT - groundY);

    stroke(synthHue, 100, 50);
    strokeWeight(2);
    for (let i = 0; i < 8; i++) {
        let y = groundY + Math.pow(i / 8, 2) * (UI_HEIGHT - groundY);
        drawingContext.globalAlpha = (i / 8);
        line(0, y, width, y);
    }
    let gridSpeed = (synthScrollX * 2.5) % 60;
    for (let x = -100; x < width + 100; x += 60) {
        let curX = x - gridSpeed;
        drawingContext.globalAlpha = 0.3;
        line(width/2 + (curX - width/2) * 0.15, groundY, curX, UI_HEIGHT);
    }
    drawingContext.globalAlpha = 1.0;

    if (isPlayerReady) {
        let sx = (Math.floor(frameCount / 15) % 2 ? 16 : 0);
        let pSize = 48; 
        
        drawingContext.save();
        drawingContext.translate(width * 0.2, groundY);
        drawingContext.scale(1, 1); 
        drawingContext.drawImage(playerImage, sx, 0, 16, 16, -pSize/2, -pSize/2, pSize, pSize);
        drawingContext.restore();
    }

    drawUI();

    push();
    translate(0, UI_HEIGHT);
    
    fill(240, 50, 5);
    noStroke();
    rect(0, 0, width, ROWS * tileSize);

    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (grid[r][c]) grid[r][c].draw();
        }
    }

    if (messageTimer > 0) {
        fill(0, 0, 0, 0.8);
        noStroke();
        rect(0, (ROWS * tileSize)/2 - 40, width, 80);
        
        fill(0, 80, 100); 
        stroke(0); strokeWeight(4);
        textAlign(CENTER, CENTER);
        textSize(width * 0.1);
        text(messageText, width/2, (ROWS * tileSize)/2);
        
        messageTimer--;
        if (messageTimer === 0) shuffleBoard(); 
    }
    pop();
}

function drawUI() {
    textAlign(LEFT, TOP); noStroke();
    
    fill(0, 0, 100); textSize(12); text("SCORE", 15, 10);
    fill(0, 0, 100); textSize(20); text(score.toLocaleString(), 15, 25);

    if (finalComboTimer > 0 && finalComboCount > 1) {
        fill(50, 100, 100); 
        stroke(0); strokeWeight(3); 
        textSize(24);
        text(finalComboCount + " COMBO!", 15, 55);
        noStroke();
        finalComboTimer--;
    } 
    else if (comboTextTimer > 0 && comboCount > 1) {
        fill(0, 0, 100, 0.8); 
        noStroke();
        textSize(20);
        text(comboCount + " COMBO", 15, 55);
        comboTextTimer--;
    }
}

// --- パズルロジック ---

function updateLogic() {
    let isBusy = false;

    for (let i = pendingFireworks.length - 1; i >= 0; i--) {
        pendingFireworks[i].timer--;
        if (pendingFireworks[i].timer <= 0) {
            let pf = pendingFireworks[i];
            if (pf.combo === 2) launchHanabi(1, 0, true);
            else launchHanabi(5, 0, true); 
            pendingFireworks.splice(i, 1);
        }
    }

    for (let r = ROWS - 1; r >= 0; r--) {
        for (let c = 0; c < COLS; c++) {
            let t = grid[r][c];
            if (!t) continue;
            if (t.state !== STATE.STABLE) isBusy = true;
            if (t.update()) {
                grid[r][c] = null;
                addScore(100);
            }
        }
    }

    for (let c = 0; c < COLS; c++) {
        for (let r = ROWS - 1; r >= 0; r--) {
            if (grid[r][c] === null) {
                isBusy = true;
                let found = false;
                for (let k = r - 1; k >= 0; k--) {
                    if (grid[k][c] && grid[k][c].state !== STATE.FALLING) {
                        grid[r][c] = grid[k][c];
                        grid[r][c].r = r;
                        grid[r][c].state = STATE.FALLING;
                        grid[r][c].yOffset = (k - r) * tileSize;
                        grid[k][c] = null;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    let nt = new Tile(r, c, floor(random(TILE_TYPES)));
                    nt.state = STATE.FALLING;
                    nt.yOffset = -tileSize * (r + 1);
                    grid[r][c] = nt;
                }
            }
        }
    }

    findMatches();

    // ★ 変更点：連鎖・手詰まりの判定ロジック（猶予フレーム導入）
    if (!isBusy && !checkMatchesOnBoard() && pendingFireworks.length === 0) {
        if (comboCount > 0) {
            if (chainGraceTimer === -1) {
                // 盤面が静止した瞬間に、30フレームの猶予タイマーをセット
                chainGraceTimer = 30;
            } else if (chainGraceTimer > 0) {
                // 猶予期間中
                chainGraceTimer--;
            } else if (chainGraceTimer === 0) {
                // 30フレーム経過しても何もしなかった場合、連鎖確定
                handleFinalFirework();
                finalComboCount = comboCount;
                finalComboTimer = 120;
                comboCount = 0;
                chainGraceTimer = -1;
            }
        } 
        else if (messageTimer === 0 && finalComboTimer === 0 && !hasPossibleMoves()) {
            messageTimer = 120; 
        }
    } else {
        // 落下中や消滅中、または新しいマッチを発見した場合はタイマーをリセットして連鎖継続
        chainGraceTimer = -1;
    }
}

function findMatches() {
    let matches = [];
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS - 2; c++) {
            let t1 = grid[r][c], t2 = grid[r][c+1], t3 = grid[r][c+2];
            if (t1 && t2 && t3 && [t1,t2,t3].every(t => t.state === STATE.STABLE)) {
                if (t1.type === t2.type && t1.type === t3.type) matches.push({tiles:[t1,t2,t3], type:t1.type});
            }
        }
    }
    for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS - 2; r++) {
            let t1 = grid[r][c], t2 = grid[r+1][c], t3 = grid[r+2][c];
            if (t1 && t2 && t3 && [t1,t2,t3].every(t => t.state === STATE.STABLE)) {
                if (t1.type === t2.type && t1.type === t3.type) matches.push({tiles:[t1,t2,t3], type:t1.type});
            }
        }
    }

    if (matches.length > 0) {
        let firstMatchInThisStep = false;
        matches.forEach(m => {
            let isNew = false;
            m.tiles.forEach(t => {
                if (t.state !== STATE.MATCHING) {
                    t.state = STATE.MATCHING;
                    t.timer = MATCH_FRAME;
                    isNew = true;
                }
            });
            if (isNew) firstMatchInThisStep = true;
        });

        if (firstMatchInThisStep) {
            comboCount++;
            comboTextTimer = 60;
            finalComboTimer = 0;
            
            if (comboCount === 1) lastMatchType = matches[0].type;
            if (comboCount % 3 === 2) {
                pendingFireworks.push({ timer: MATCH_FRAME, combo: comboCount });
            }
        }
    }
}

function hasPossibleMoves() {
    for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
            if (c < COLS - 1 && testMove(r, c, r, c + 1)) return true;
            if (r < ROWS - 1 && testMove(r, c, r + 1, c)) return true;
        }
    }
    return false;
}

function testMove(r1, c1, r2, c2) {
    let t1 = grid[r1][c1], t2 = grid[r2][c2];
    if (!t1 || !t2) return false;
    let temp = t1.type; t1.type = t2.type; t2.type = temp;
    let result = hasMatch(r1, c1) || hasMatch(r2, c2);
    t2.type = t1.type; t1.type = temp;
    return result;
}

// --- 花火制御 ---

function handleFinalFirework() {
    if (comboCount === 1) {
        launchHanabi(1, lastMatchType, false);
    } else if (comboCount % 3 !== 2) {
        if (comboCount >= 6) {
            launchHanabi(5, 0, true);
        } else {
            launchHanabi(3, 0, true); 
        }
    }
}

function launchHanabi(shots, type, isRandomColor) {
    let scale = (shots === 1) ? "SMALL" : (shots === 3) ? "MEDIUM" : "SUPER";
    for (let i = 0; i < shots; i++) {
        let x = width/2;
        if (shots > 1) x = width/2 + (i - (shots-1)/2) * (width/shots) * 0.7;
        
        let fireworkColor;
        if (isRandomColor) {
            fireworkColor = NEON_COLORS[floor(random(TILE_TYPES))];
        } else {
            fireworkColor = NEON_COLORS[type];
        }
        
        fireworks.push(new Firework(x, fireworkColor, scale));
    }
}

// --- クラス ---

class Tile {
    constructor(r, c, type) {
        this.r = r; this.c = c; this.type = type;
        this.state = STATE.STABLE;
        this.timer = 0; this.yOffset = 0;
    }
    draw() {
        let x = this.c * tileSize, y = this.r * tileSize + this.yOffset;
        push();
        translate(x + tileSize/2, y + tileSize/2);
        
        if (this.state === STATE.MATCHING) {
            let s = map(this.timer, MATCH_FRAME, 0, 1.0, 0.0);
            scale(s);
        }
        
        imageMode(CENTER);
        image(tileImages[this.type], 0, 0, tileSize * 0.9, tileSize * 0.9);
        if (selectedTile && selectedTile.r === this.r && selectedTile.c === this.c) {
            noFill(); stroke(0, 0, 100); strokeWeight(4); 
            rect(-tileSize/2+2, -tileSize/2+2, tileSize-4, tileSize-4); 
        }
        pop();
    }
    update() {
        if (this.state === STATE.MATCHING) { this.timer--; return this.timer <= 0; }
        if (this.state === STATE.FALLING) {
            // ★ 変更点：落下速度を 16 から 8 に変更（ゆっくり落ちる）
            this.yOffset += 8;
            if (this.yOffset >= 0) { this.yOffset = 0; this.state = STATE.STABLE; }
        }
        return false;
    }
}

class Firework {
    constructor(x, colorObj, scale) {
        this.x = x; 
        this.col = colorObj; 
        this.scale = scale;
        this.y = UI_HEIGHT * 0.65 + 10; 
        
        this.targetY = random(UI_HEIGHT * 0.1, UI_HEIGHT * 0.4);
        this.ascentSpeed = random(4, 7);
        this.exploded = false; this.particles = []; this.isDead = false;
    }
    update() {
        if (!this.exploded) {
            this.y -= this.ascentSpeed;
            if (this.y <= this.targetY) this.explode();
        } else {
            for (let i = this.particles.length - 1; i >= 0; i--) {
                this.particles[i].update();
                if (this.particles[i].life <= 0) this.particles.splice(i, 1);
            }
            if (this.particles.length === 0) this.isDead = true;
        }
    }
    explode() {
        this.exploded = true;
        let count = (this.scale === "SMALL") ? 30 : (this.scale === "MEDIUM") ? 60 : 120;
        for (let i = 0; i < count; i++) {
            this.particles.push(new Particle(this.x, this.y, this.col, this.scale));
        }
    }
    draw() {
        rectMode(CENTER);
        if (!this.exploded) {
            fill(this.col.h, this.col.s, this.col.b); noStroke();
            rect(this.x, this.y, 4, 12); 
        } else {
            for (let p of this.particles) p.draw();
        }
        rectMode(CORNER);
    }
}

class Particle {
    constructor(x, y, colorObj, scale) {
        this.pos = createVector(x, y);
        let force = (scale === "SUPER") ? 5 : (scale === "MEDIUM") ? 3.5 : 2.5;
        this.vel = p5.Vector.random2D().mult(random(1, force));
        this.col = colorObj; 
        this.life = 1.0; this.decay = random(0.02, 0.04);
    }
    update() {
        this.vel.mult(0.92);
        this.pos.add(this.vel);
        this.pos.y += 0.15; 
        this.life -= this.decay;
    }
    draw() {
        noStroke();
        if (this.life > 0.3 || frameCount % 2 === 0) {
            fill(this.col.h, this.col.s, this.col.b, this.life);
            rect(this.pos.x, this.pos.y, 4, 4); 
        }
    }
}

function addScore(pts) { score += pts * comboCount; }

// --- 操作 ---

function touchMoved() { return false; }

function mousePressed() {
    if (messageTimer > 0) return;
    
    finalComboTimer = 0; 
    let c = floor(mouseX / tileSize);
    let r = floor((mouseY - UI_HEIGHT) / tileSize);
    if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
        if (grid[r][c]?.state === STATE.STABLE) {
            dragStart = { r, c };
            startMouseX = mouseX;
            startMouseY = mouseY;
        }
    }
}

function mouseReleased() {
    if (!dragStart || messageTimer > 0) return;
    
    let dx = mouseX - startMouseX;
    let dy = mouseY - startMouseY;
    
    if (abs(dx) < 20 && abs(dy) < 20) {
        let c = floor(mouseX / tileSize);
        let r = floor((mouseY - UI_HEIGHT) / tileSize);
        if (selectedTile) {
            if (abs(selectedTile.r - r) + abs(selectedTile.c - c) === 1) {
                trySwap(selectedTile.r, selectedTile.c, r, c);
                selectedTile = null;
            } else {
                selectedTile = { r, c };
            }
        } else {
            selectedTile = { r, c };
        }
    } 
    else {
        let r1 = dragStart.r;
        let c1 = dragStart.c;
        let r2 = r1;
        let c2 = c1;
        
        if (abs(dx) > abs(dy)) {
            c2 += (dx > 0) ? 1 : -1;
        } else {
            r2 += (dy > 0) ? 1 : -1;
        }
        trySwap(r1, c1, r2, c2);
        selectedTile = null;
    }
    dragStart = null;
}

function trySwap(r1, c1, r2, c2) {
    if (r2 < 0 || r2 >= ROWS || c2 < 0 || c2 >= COLS) return;
    let t1 = grid[r1][c1], t2 = grid[r2][c2];
    if (t1?.state === STATE.STABLE && t2?.state === STATE.STABLE) {
        let temp = t1.type; t1.type = t2.type; t2.type = temp;
        if (!hasMatch(r1, c1) && !hasMatch(r2, c2)) {
            t2.type = t1.type; t1.type = temp;
        }
    }
}

function hasMatch(r, c) {
    let type = grid[r][c]?.type;
    if (type === undefined) return false;
    let h = 1, v = 1;
    for (let i = c - 1; i >= 0 && grid[r][i]?.type === type; i--) h++;
    for (let i = c + 1; i < COLS && grid[r][i]?.type === type; i++) h++;
    for (let i = r - 1; i >= 0 && grid[i][c]?.type === type; i--) v++;
    for (let i = r + 1; i < ROWS && grid[i][c]?.type === type; i++) v++;
    return h >= 3 || v >= 3;
}

function checkMatchesOnBoard() {
    for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) if(hasMatch(r,c)) return true;
    return false;
}

function shuffleBoard() {
    let valid = false;
    while (!valid) {
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) grid[r][c] = new Tile(r, c, floor(random(TILE_TYPES)));
        }
        if (!checkMatchesOnBoard() && hasPossibleMoves()) {
            valid = true;
        }
    }
}

function initGrid() {
    shuffleBoard();
    score = 0; 
}
</script>
</body>
</html>
